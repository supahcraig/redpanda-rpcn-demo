name: rp-demo
networks:
  demo_net:
    driver: bridge

volumes:
  redpanda-0: null
  redpanda-1: null
  redpanda-2: null

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr=redpanda-0:33145
      - --advertise-rpc-addr=redpanda-0:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=info
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - demo_net
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda-1:9092,external://localhost:29092
      - --rpc-addr=redpanda-1:33145
      - --advertise-rpc-addr=redpanda-1:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=info
      - --seeds=redpanda-0:33145
    volumes:
      - redpanda-1:/var/lib/redpanda/data
    networks:
      - demo_net
    depends_on:
      - redpanda-0

  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:39092
      - --advertise-kafka-addr=internal://redpanda-2:9092,external://localhost:39092
      - --rpc-addr=redpanda-2:33145
      - --advertise-rpc-addr=redpanda-2:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=info
      - --seeds=redpanda-0:33145
    volumes:
      - redpanda-2:/var/lib/redpanda/data
    networks:
      - demo_net
    depends_on:
      - redpanda-0

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console -config.filepath=/tmp/config.yml'
    environment:
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092","redpanda-1:9092","redpanda-2:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - "8080:8080"
    networks:
      - demo_net
    depends_on:
      - redpanda-0
      - redpanda-1
      - redpanda-2

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - demo_net

  connect-mq:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: connect-mq
    volumes:
      - ./pipelines/mq.yaml:/connect.yaml
    command: ["run"]
    networks:
      - demo_net
    depends_on:
      - redpanda-0

  connect-alerting:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: connect-alerting
    volumes:
      - ./pipelines/alerting.yaml:/connect.yaml
    command: ["run"]
    networks:
      - demo_net
    depends_on:
      - redpanda-0
      - connect-mq

  connect-enrichment:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: connect-enrichment
    volumes:
      - ./pipelines/enrichment.yaml:/connect.yaml
    command: ["run"]
    networks:
      - demo_net
    depends_on:
      - redpanda-0
      - postgres

  sftp:
    image: atmoz/sftp:latest
    container_name: sftp
    command: demo:demopass:1001
    volumes:
      - ./sftp-data/incoming:/home/demo/incoming
    networks:
      - demo_net

  connect-ftp-iceberg:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: connect-ftp-iceberg
    volumes:
      - ./pipelines/ftp_iceberg.yaml:/connect.yaml
      # Enterprise license required by the `iceberg` output. See stack/README.md
      # for how to obtain/place this file and the correct ownership/permissions.
      - /home/ubuntu/secrets/redpanda.license:/etc/redpanda/redpanda.license:ro
    command: ["run"]
    networks:
      - demo_net
    depends_on:
      - sftp
